<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حليم وتنه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg1:#2b1740; --bg2:#5a2347; --blush:#f6d3d8; --gold:#e6bd7a; --text:#fbeff1; }
  * { box-sizing:border-box; margin:0; }
  body {
    font-family:"Tajawal",system-ui,sans-serif; color:var(--text);
    background:linear-gradient(170deg,var(--bg1),var(--bg2)); background-attachment:fixed;
    padding:40px 18px 60px; text-align:center; line-height:1.7;
  }
  main { max-width:720px; margin:0 auto; }
  section { margin-top:48px; }
  h1 { font-family:"Aref Ruqaa",serif; font-size:clamp(2.4rem,9vw,4rem); color:var(--blush); line-height:1.3; }
  h2 { font-family:"Aref Ruqaa",serif; font-size:1.5rem; color:var(--gold); margin-bottom:14px; }
  .sub { color:var(--gold); margin-top:4px; }
  .heart { color:#e8758f; display:inline-block; animation:beat 1.6s ease-in-out infinite; }
  @keyframes beat { 0%,100%{transform:scale(1)} 50%{transform:scale(1.18)} }
  @media (prefers-reduced-motion:reduce){ .heart{animation:none} }

  .timer { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-top:28px; }
  .unit { border:1px solid rgba(230,189,122,.45); border-radius:14px; padding:16px 4px; background:rgba(255,255,255,.04); }
  .num { font-size:clamp(1.8rem,8vw,3.2rem); font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; line-height:1.1; }
  .lbl { font-size:.95rem; opacity:.85; }

  #stageMsg { margin-top:22px; font-size:1.15rem; color:var(--blush); }
  .stages { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:14px; }
  .chip { padding:5px 14px; border-radius:99px; border:1px solid rgba(230,189,122,.4); font-size:.9rem; opacity:.55; }
  .chip.done { background:var(--gold); color:#3a2150; opacity:1; font-weight:700; }

  #quote { font-family:"Aref Ruqaa",serif; font-size:clamp(1.4rem,5vw,2.1rem); line-height:2; color:var(--blush); max-width:34ch; margin:0 auto; }

  .gallery { position:relative; max-width:460px; margin:0 auto; aspect-ratio:4/5; border-radius:18px; overflow:hidden; border:2px solid rgba(230,189,122,.5); cursor:pointer; }
  .gallery img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0; transition:opacity 1s; }
  .gallery img.on { opacity:1; }

  .since { font-size:1.2rem; color:var(--blush); }
  .since b { color:var(--gold); font-size:1.5rem; }

  .cards { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:520px){ .cards{grid-template-columns:1fr} }
  .card { border:1px solid rgba(230,189,122,.45); border-radius:14px; padding:18px 14px; background:rgba(255,255,255,.04); }
  .card h3 { font-family:"Aref Ruqaa",serif; color:var(--blush); font-size:1.3rem; margin-bottom:8px; }
  input, textarea, select, button {
    font:inherit; color:inherit; background:rgba(255,255,255,.08); border:1px solid rgba(230,189,122,.45);
    border-radius:10px; padding:9px 12px; width:100%; margin-top:8px;
  }
  select option { color:#222; }
  button { background:var(--gold); color:#3a2150; font-weight:700; cursor:pointer; border:0; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline:2px solid var(--blush); outline-offset:2px; }
  .revealed { font-family:"Aref Ruqaa",serif; font-size:1.25rem; line-height:2; color:var(--blush); white-space:pre-wrap; }
  .err { color:#ffb3b3; font-size:.9rem; min-height:1.2em; }
  details { margin-top:18px; text-align:right; border:1px dashed rgba(230,189,122,.5); border-radius:14px; padding:12px 14px; }
  summary { cursor:pointer; color:var(--gold); font-weight:700; }
  .hint { font-size:.9rem; opacity:.8; margin-top:6px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>حليم وتنه <span class="heart">♥</span></h1>
    <p class="sub" id="dateLabel"></p>
    <div class="timer">
      <div class="unit"><div class="num" id="d">0</div><div class="lbl">يوم</div></div>
      <div class="unit"><div class="num" id="h">0</div><div class="lbl">ساعة</div></div>
      <div class="unit"><div class="num" id="m">0</div><div class="lbl">دقيقة</div></div>
      <div class="unit"><div class="num" id="s">0</div><div class="lbl">ثانية</div></div>
    </div>
    <p id="stageMsg"></p>
    <div class="stages" id="stages"></div>
  </header>

  <section>
    <h2>رسالة حب اليوم</h2>
    <p id="quote"></p>
  </section>

  <section id="gallerySec" hidden>
    <h2>لحظاتنا</h2>
    <div class="gallery" id="gallery" title="اضغط للصورة التالية"></div>
  </section>

  <section>
    <h2>من أول يوم عرفنا فيه بعض</h2>
    <p class="since" id="since"></p>
  </section>

  <section>
    <h2>رسائل يوم الزفاف</h2>
    <p class="hint" id="secretHint"></p>
    <div class="cards" style="margin-top:14px">
      <div class="card" id="card-halim"><h3>رسالة حليم</h3><div class="body"></div></div>
      <div class="card" id="card-faten"><h3>رسالة تنه</h3><div class="body"></div></div>
    </div>
  </section>
</main>

<script>
// ================= الإعدادات =================
const MONTH = 2, DAY = 15;                 // 15 مارس
const KNOW_EACH_OTHER = "2026-04-23";      // ← غيّر ده لتاريخ أول يوم عرفتوا فيه بعض (سنة-شهر-يوم)
const PHOTOS = [
  "images/1.jpg"
];
const FIREBASE = { projectId: "__PID__", apiKey: "__KEY__" };

const MILESTONES = [
  [100, "باقي 100 يوم، والعد التنازلي بدأ بجد ♥"],
  [60,  "باقي شهرين بس على يوم العمر!"],
  [30,  "باقي شهر واحد، والقلب مش مصدق!"],
  [14,  "باقي أسبوعين.. التفاصيل بتكتمل والفرحة بتكبر."],
  [7,   "باقي أسبوع واحد! الأيام الجاية أجمل أيام."],
  [3,   "باقي 3 أيام بس، خد نفس عميق وافرح."],
  [1,   "بكرة يوم زفافنا! النهارده آخر ليلة قبل الحكاية."],
  [0,   "النهارده يوم زفاف حليم وتنه! ألف مبروك ♥"]
];

const QUOTES = [
  "كل يوم يمرّ يقرّبني منك خطوة، وقلبي سابق الأيام إليك.",
  "لم أكن أبحث عنك، لكن قلبي عرفك من أول نظرة وقال: وجدتُ بيتي.",
  "معك أصبح للانتظار طعم جميل، لأن نهايته أنتِ.",
  "في عينيك وطن، وفي صوتك أمان لم أعرفه قبلك.",
  "أحبك حبًا يجعل أصعب الأيام تهون، لأنني أعرف أنك في آخرها.",
  "كل الطرق كانت تقودني إليك، وأنا لم أكن أدري.",
  "لو قيل لي اختر مكانًا في الدنيا، لاخترتُ أن أكون بجوارك.",
  "ضحكتك هي أجمل ما حدث لي، وأحب ما أريد أن أحميه.",
  "معك فهمت أن الحب ليس كلمة تُقال، بل سكينة تسكن القلب.",
  "أشتاق إليك حتى وأنتِ في بالي، فكيف إذا غبتِ عن ناظري؟",
  "أنتِ الدعاء الذي تأخر قليلًا، ثم جاء أجمل مما تمنيت.",
  "سأكون لكِ السند في الضيق، والفرح في الفرح، والبيت في كل حال.",
  "كل ما فيك يشبه الطمأنينة، حتى صمتك.",
  "قلبي اختارك مرة، ويعيد اختيارك كل صباح.",
  "لا أريد عمرًا طويلًا، أريد عمرًا معك، ولو كان قصيرًا.",
  "وجودك جعل الأيام العادية أجمل ذكرياتي.",
  "أحببتك بعقلي حين فهمتك، وبقلبي حين عرفتك، وبروحي حين لم أستطع تركك.",
  "يا من جمعني الله بها، أنتِ نعمة أشكره عليها كل يوم.",
  "حين أتخيل المستقبل، أرى يدك في يدي، وأطمئن.",
  "ليس أصدق من عيني حين تنظران إليك، فكل الحب يظهر فيهما.",
  "تعلمتُ معك أن البيت ليس جدرانًا، بل شخص نعود إليه.",
  "أخاف على كل شيء أحبه، وأنتِ أغلى ما أحب.",
  "يكفيني من الدنيا نظرة رضا منك، وكلمة حلوة تخرج من قلبك.",
  "كل يوم أقترب منك، أشعر أن قلبي يكبر ليتّسع لك أكثر.",
  "ستكونين آخر من أفكر فيه ليلًا، وأول من أشتاق إليه صباحًا.",
  "حبي لك لا يحتاج إلى مناسبة، لكن زواجنا أجمل مناسبة له.",
  "معك أصبحت أؤمن أن القدر يعرف جيدًا ماذا يفعل.",
  "سأحفظ قلبك كما أحفظ أغلى ما عندي، وأكثر.",
  "هذه الأيام القليلة تفصلنا عن حكاية عمر، وأنا مستعد لها بكل قلبي.",
  "أنتِ لستِ حلمي فقط، أنتِ الحقيقة التي فاقت كل أحلامي."
];
const WEDDING_QUOTE = "اليوم نبدأ حكاية العمر.. أحبك، وبحبك، وهكون ليكِ طول العمر. ألف مبروك لنا ♥";

// ================= العد التنازلي =================
const $ = id => document.getElementById(id);
const now0 = new Date();
let target = new Date(now0.getFullYear(), MONTH, DAY);
if (now0 > new Date(now0.getFullYear(), MONTH, DAY, 23, 59, 59)) target = new Date(now0.getFullYear() + 1, MONTH, DAY);
const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
$("dateLabel").textContent = DAY + " " + months[MONTH] + " " + target.getFullYear();

function daysLeft() {
  const t = new Date(); const today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  return Math.round((target - today) / 86400000);
}
function isWeddingDayOrAfter() { return new Date() >= target || new URLSearchParams(location.search).has("test"); }

function tick() {
  let s = Math.max(0, Math.floor((target - new Date()) / 1000));
  $("d").textContent = Math.floor(s / 86400);
  $("h").textContent = Math.floor((s % 86400) / 3600);
  $("m").textContent = Math.floor((s % 3600) / 60);
  $("s").textContent = s % 60;
}
tick(); setInterval(tick, 1000);

// مراحل العد التنازلي
(function () {
  const left = daysLeft();
  const passed = MILESTONES.filter(([d]) => left <= d);
  $("stageMsg").textContent = passed.length ? passed[passed.length - 1][1] : "كل يوم بيقرّبنا أكتر من يوم العمر ♥";
  $("stages").innerHTML = MILESTONES.map(([d]) =>
    `<span class="chip ${left <= d ? "done" : ""}">${d === 0 ? "يوم الزفاف" : d === 1 ? "بكرة" : "باقي " + d}</span>`).join("");
})();

// اقتباس اليوم
(function () {
  const t = new Date(); const today = new Date(t.getFullYear(), t.getMonth(), t.getDate());
  $("quote").textContent = today.getTime() === target.getTime()
    ? WEDDING_QUOTE : QUOTES[Math.floor(today.getTime() / 86400000) % QUOTES.length];
})();

// ================= الصور =================
(function () {
  const box = $("gallery"); let imgs = [], cur = 0, loaded = 0;
  PHOTOS.forEach(src => {
    const im = new Image(); im.alt = "حليم وتنه";
    im.onload = () => {
      box.appendChild(im); imgs.push(im);
      if (++loaded === 1) { im.classList.add("on"); $("gallerySec").hidden = false; }
    };
    im.src = src;
  });
  function next() { if (imgs.length < 2) return; imgs[cur].classList.remove("on"); cur = (cur + 1) % imgs.length; imgs[cur].classList.add("on"); }
  box.addEventListener("click", next);
  setInterval(next, 5000);
})();

// ================= عدّاد التعارف =================
(function () {
  const start = new Date(KNOW_EACH_OTHER + "T00:00:00"), n = new Date();
  let y = n.getFullYear() - start.getFullYear(), m = n.getMonth() - start.getMonth(), d = n.getDate() - start.getDate();
  if (d < 0) { m--; d += new Date(n.getFullYear(), n.getMonth(), 0).getDate(); }
  if (m < 0) { y--; m += 12; }
  const total = Math.floor((n - start) / 86400000);
  const parts = [];
  if (y > 0) parts.push(`<b>${y}</b> ${y === 1 ? "سنة" : "سنين"}`);
  if (m > 0) parts.push(`<b>${m}</b> ${m === 1 ? "شهر" : "شهور"}`);
  parts.push(`<b>${d}</b> ${d === 1 ? "يوم" : "يوم"}`);
  $("since").innerHTML = total < 0 ? "ضيف التاريخ الصح في الملف ♥"
    : `بقالنا ${parts.join(" و ")}<br><small>يعني ${total.toLocaleString("ar-EG")} يوم من الحب</small>`;
})();

// ================= الرسائل (Firebase + تشفير) =================
const configured = FIREBASE.projectId && !FIREBASE.projectId.startsWith("__");
const docUrl = who => `https://firestore.googleapis.com/v1/projects/${FIREBASE.projectId}/databases/(default)/documents/messages/${who}?key=${FIREBASE.apiKey}`;
async function getCode(who) {
  const r = await fetch(docUrl(who));
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(r.status);
  return (await r.json()).fields.code.stringValue;
}
async function putCode(who, code) {
  const r = await fetch(docUrl(who), { method: "PATCH", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ fields: { code: { stringValue: code } } }) });
  if (!r.ok) throw new Error(r.status);
}
const enc = new TextEncoder(), dec = new TextDecoder();
const toB64 = u8 => btoa(String.fromCharCode(...u8));
const fromB64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function keyFrom(pw, salt) {
  const km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]);
}
async function seal(text, pw) {
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv }, await keyFrom(pw, salt), enc.encode(text)));
  const all = new Uint8Array(28 + ct.length); all.set(salt); all.set(iv, 16); all.set(ct, 28);
  return toB64(all);
}
async function unseal(code, pw) {
  const all = fromB64(code);
  return dec.decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: all.slice(16, 28) }, await keyFrom(pw, all.slice(0, 16)), all.slice(28)));
}

const weddingOpen = isWeddingDayOrAfter();
$("secretHint").textContent = weddingOpen
  ? "جه الوقت! كل واحد يكتب كلمة سر رسالته ويفتحها للتاني ♥"
  : "كل واحد فينا بيكتب رسالة للتاني ومقفولة بكلمة سر. هتتفتح يوم الزفاف ♥";

async function renderCards() {
  for (const who of ["halim", "faten"]) {
    const body = document.querySelector(`#card-${who} .body`);
    if (!configured) { body.innerHTML = '<p class="hint">الربط لسه ما اتعملش.</p>'; continue; }
    body.innerHTML = '<p class="hint">لحظة...</p>';
    let code;
    try { code = await getCode(who); } catch (e) { body.innerHTML = '<p class="hint">مش قادر أحمّل الرسالة دلوقتي.</p>'; continue; }
    if (!code) { body.innerHTML = '<p class="hint">لسه ما اتكتبتش.</p>'; continue; }
    if (!weddingOpen) { body.innerHTML = '<p class="hint">🔒 مكتوبة ومقفولة لحد يوم الزفاف</p>'; continue; }
    body.innerHTML = '<input type="password" placeholder="كلمة سر الرسالة" autocomplete="off"><button type="button">افتح الرسالة</button><p class="err"></p>';
    const inp = body.querySelector("input"), btn = body.querySelector("button"), err = body.querySelector(".err");
    btn.onclick = async () => {
      try { const t = await unseal(code, inp.value); body.innerHTML = '<p class="revealed"></p>'; body.firstChild.textContent = t; }
      catch (e) { err.textContent = "كلمة السر غلط."; }
    };
  }
}

renderCards();
</script>
</body>
</html>
