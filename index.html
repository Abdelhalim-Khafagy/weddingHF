const ITER = 310000;
const unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const all = unb64(PAYLOAD), enc = new TextEncoder();
  const km = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:all.slice(0,16), iterations:ITER, hash:"SHA-256" },
    km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:all.slice(16,28) }, key, all.slice(28));
  return new TextDecoder().decode(pt);
}
async function enter(pw, auto) {
  const err = document.getElementById("err");
  err.textContent = auto ? "" : "لحظة...";
  try {
    const html = await unlock(pw);
    try { localStorage.setItem("hf_pw", pw); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    if (auto) { try { localStorage.removeItem("hf_pw"); } catch (x) {} }
    else err.textContent = "كلمة السر غلط، حاول تاني.";
  }
}
document.getElementById("go").onclick = () => enter(document.getElementById("pw").value, false);
document.getElementById("pw").addEventListener("keydown", e => { if (e.key === "Enter") enter(e.target.value, false); });
try { const saved = localStorage.getItem("hf_pw"); if (saved) enter(saved, true); } catch (e) {}
</script>
